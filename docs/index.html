<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>보청기 판매업체 지도</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <h1>보청기 판매업체</h1>
    <nav class="tabs">
      <a href="index.html" class="on">지도</a>
      <a href="list.html">리스트</a>
    </nav>
    <div class="meta" id="meta"></div>
  </header>

  <main class="map-layout">
    <aside class="sidebar">
      <div class="tools">
        <input id="search" type="search" placeholder="업체명 검색">
        <button class="btn" id="reset">전체 보기</button>
      </div>
      <div class="region-list" id="regions"></div>
    </aside>
    <div id="map" style="position:relative"></div>
  </main>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/map.js"></script>

</html>
